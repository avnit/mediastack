#########################################################################
# internal.yaml — split-horizon LAN routes for <name>.asbblog.com
# Generated Sep 03 2026 from the Cloudflare Tunnel published-routes list.
# Sep 05 2026: added lan-unifi (UCG Fiber .1) so Homarr can reach UniFi via the LE cert.
# UniFi resolves these names to 192.168.0.17 on the LAN only; off-LAN the
# public Cloudflare record wins.  TLS: *.asbblog.com Let's Encrypt wildcard.
# Router names are prefixed lan- and carry priority 100 so they beat any
# docker-label router for the same Host (grafana/portainer/headscale).
# Chain: lan-only (ipAllowList) + security-headers@file.  No Authentik/CrowdSec on LAN.
#########################################################################
http:
  middlewares:
    lan-only:
      ipAllowList:
        sourceRange:
        - 192.168.0.0/24
        - 192.168.30.0/24
        - 100.64.0.0/10
        - 10.100.0.0/22
        - 127.0.0.1/32
    pi-root-redirect:
      redirectRegex:
        regex: ^https://pi\.asbblog\.com/?$
        replacement: https://pi.asbblog.com/admin/
    pi3-root-redirect:
      redirectRegex:
        regex: ^https://pi3\.asbblog\.com/?$
        replacement: https://pi3.asbblog.com/admin/
  routers:
    lan-tools:
      rule: Host(`tools.asbblog.com`)
      entryPoints:
      - secureweb
      priority: 100
      service: lan-tools
      middlewares:
      - lan-only
      - security-headers@file
    lan-pi:
      rule: Host(`pi.asbblog.com`)
      entryPoints:
      - secureweb
      priority: 100
      service: lan-pi
      middlewares:
      - lan-only
      - pi-root-redirect
      - security-headers@file
