# Traefik access log. Written by the traefik container to
# /opt/data/logs/traefik/access.log (bind-mounted as /var/log/access.log).
#
# copytruncate is used deliberately: traefik holds the file open, and this avoids
# depending on signalling the container to reopen its log. A handful of lines can
# be lost in the copy window, which is an acceptable trade for request logs.
/opt/data/logs/traefik/*.log {
    daily
    rotate 7
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}
