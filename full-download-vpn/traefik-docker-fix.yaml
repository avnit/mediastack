#########################################################################
# docker-fix.yaml — hand-maintained; NOT generated by gen-lan-docker.sh.
#
# Every <svc>@docker router returns 404 with ServiceName=null, because each one carries
# authentik-forwardauth@file and that middleware 404s (see below). The services themselves
# are fine -- bazarr@docker resolves to http://gluetun:6767 and serves 200 when reached.
#
# So these are priority-100 twins that fix routing AND add traefik-bouncer (CrowdSec),
# which the lan-only twins in lan-docker.yaml they replace did not have.
#
# authentik-forwardauth@file is deliberately NOT used here: the embedded outpost at
# http://authentik:9000/outpost.goauthentik.io/auth/traefik returns 404, so any router
# carrying it 404s before reaching its service (verified by A/B test 2026-09-11). That
# is why every <svc>@docker router was dead. Once the outpost is fixed in the Authentik
# admin UI (assign the applications to the embedded outpost), swap lan-only ->
# authentik-forwardauth here to require login instead of merely restricting to the LAN.
#########################################################################
http:
  routers:
    fix-bazarr:
      rule: "Host(`bazarr.asbblog.com`)"
      entryPoints: [secureweb]
      priority: 100
      service: bazarr@docker
      middlewares: [authentik-forwardauth@file, security-headers@file, traefik-bouncer@file]
    fix-caddy:
      rule: "Host(`caddy.asbblog.com`)"
      entryPoints: [secureweb]
      priority: 100
      service: caddy@docker
      middlewares: [authentik-forwardauth@file, security-headers@file, traefik-bouncer@file]
